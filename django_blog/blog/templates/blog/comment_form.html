{% extends "blog/base.html" %}
{% block content %}
    <h2>{% if object %}Edit Comment{% else %}Add Comment{% endif %}</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Post Comment</button>
        <a href="javascript:history.back()">Cancel</a>
    </form>
{% endblock content %}
