{% extends "blog/base.html" %}
{% block content %}
    <div style="border: 1px solid #ccc; padding: 20px;">
        <h2>{{ post.title }}</h2>
        <p>By {{ post.author }} on {{ post.published_date|date:"F d, Y" }}</p>
        
        {% if object.author == user %}
            <a href="{% url 'post-update' post.id %}"><button>Edit</button></a>
            <a href="{% url 'post-delete' post.id %}"><button style="color: red;">Delete</button></a>
        {% endif %}
        
        <hr>
        <p>{{ post.content }}</p>
    </div>
{% endblock content %}
