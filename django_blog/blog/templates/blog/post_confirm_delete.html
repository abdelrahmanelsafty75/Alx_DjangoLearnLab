{% extends "blog/base.html" %}
{% block content %}
    <h2>Delete Post</h2>
    <form method="POST">
        {% csrf_token %}
        <p>Are you sure you want to delete the post: "<strong>{{ object.title }}</strong>"?</p>
        <button type="submit" style="color: red;">Yes, Delete</button>
        <a href="{% url 'post-detail' object.id %}">Cancel</a>
    </form>
{% endblock content %}
